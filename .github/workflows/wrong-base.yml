{
  "name": "Merge group wrong-base.yml",
  "on": {
    "merge_group": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "Probe wrong-base",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "outputs": {
        "evidence_sha256": "${{ steps.probe.outputs.evidence_sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "token": ""
          }
        },
        {
          "id": "probe",
          "name": "Execute immutable source probe",
          "run": "node probe.cjs",
          "env": {
            "CTX_SHA": "${{ github.sha }}",
            "CTX_REF": "${{ github.ref }}",
            "CTX_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "CTX_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "WORKFLOW_MARKER": "wrong-base.yml:fourth-pr-revision"
          }
        }
      ]
    }
  }
}
